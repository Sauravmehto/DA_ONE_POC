# Portainer / server: pull-only hosted DEV stack (no build).
# Requires stack env: DOMAIN=dataalpha.in
# Requires external Docker network: web (same network Traefik is on)
#
# Does not replace docker-compose.prod.yml — run as a separate Portainer stack.
#
# Build prod targets locally, retag as :dev, then push (leaves :latest alone):
#   docker compose -f docker-compose.yml build backend frontend
#   docker tag 629143592903.dkr.ecr.us-east-1.amazonaws.com/ai-reporting-be:latest \
#     629143592903.dkr.ecr.us-east-1.amazonaws.com/ai-reporting-be:dev
#   docker tag 629143592903.dkr.ecr.us-east-1.amazonaws.com/ai-reporting-fe:latest \
#     629143592903.dkr.ecr.us-east-1.amazonaws.com/ai-reporting-fe:dev
#   docker push 629143592903.dkr.ecr.us-east-1.amazonaws.com/ai-reporting-be:dev
#   docker push 629143592903.dkr.ecr.us-east-1.amazonaws.com/ai-reporting-fe:dev
#
# Public URL: https://one-dev.${DOMAIN}
#   /       → frontend (nginx :80)
#   /api/*  → backend (:8000)

networks:
  web:
    external: true

volumes:
  # App accounts (APP_DB_PATH). WITHOUT this, every redeploy deletes every
  # account and everyone's password. It must be a local volume: SQLite's
  # locking is not safe on a network share. Named outright, not left to the
  # stack name, so the dev and prod stacks can never share one file.
  app_data:
    name: dataalpha_app_data_dev
  # Uploaded workbooks, their DuckDB files, approved templates and generated
  # reports (MCP_EXCEL_STORAGE_DIR). Deliberately left unnamed: the stack
  # running on the server created it as <stack>_backend_excel_storage, and
  # naming it here would attach a new empty volume and orphan every upload.
  backend_excel_storage:
  # Semantic-layer TOMLs the app store is seeded from on a first run. Unnamed
  # for the same reason. Docker seeds a named volume only when it creates one
  # empty, so TOMLs shipped in a later image do not reach an existing volume.
  backend_config:

services:
  backend:
    image: 629143592903.dkr.ecr.us-east-1.amazonaws.com/ai-reporting-be:dev
    pull_policy: always
    restart: unless-stopped
    # Values come from Portainer stack Environment (no .env file in the repo).
    environment:
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      WEBAPP_BASE_URL: ${WEBAPP_BASE_URL}
      SESSION_BACKEND: ${SESSION_BACKEND:-redis}
      # Session keys carry no per-deployment prefix, so this must not be the
      # database index production uses: sharing one means a session issued here
      # is a valid session there. A different index on the same server is enough
      # (redis://host:6379/1).
      REDIS_URL: ${REDIS_URL}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_DEFAULT_ROLE: ${SNOWFLAKE_DEFAULT_ROLE}
      SNOWFLAKE_AVAILABLE_ROLES: ${SNOWFLAKE_AVAILABLE_ROLES}
      # Snowflake roles allowed into the semantic-layer admin portal.
      # MUST be declared here, not only in the Portainer stack environment:
      # stack variables fill in ${...} when the compose file is rendered, but a
      # container only receives what this block names. Unset means NOBODY is an
      # admin (a deliberate default), which presents as the Configuration
      # section vanishing and /admin/semantic returning 403 for every user.
      ADMIN_ROLES: ${ADMIN_ROLES}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      # App accounts, kept in a SQLite file on the app_data volume below. Named
      # here or the container never receives them.
      APP_DB_PATH: ${APP_DB_PATH:-/app/data/app.db}
      SIGNUP_MODE: ${SIGNUP_MODE:-invite}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Dashboard panel queries run at once, per dashboard (1-8). 1 = one after
      # another, the previous behaviour. Named here or the container never
      # receives it.
      DASHBOARD_QUERY_CONCURRENCY: ${DASHBOARD_QUERY_CONCURRENCY:-1}
      # Hosts the Connections page may save a SQL Server connection to.
      DB_CONNECTION_ALLOWED_HOSTS: ${DB_CONNECTION_ALLOWED_HOSTS:-}
      # TDS protocol version for SQL Server logins: 7.4 for SQL Server 2012+,
      # 7.3 for 2008. Unset, the driver guesses and each login can take 16s.
      SQLSERVER_TDS_VERSION: ${SQLSERVER_TDS_VERSION:-7.4}
      # Rows one Excel extract may read.
      MCP_EXCEL_MAX_ROWS: ${MCP_EXCEL_MAX_ROWS:-25000}
      # Where uploads, templates and reports are written. The default already
      # resolves to this path inside the image; stated so it cannot drift off
      # the volume if the working directory ever changes.
      # Not named, so it stays at "local": EXCEL_STORAGE_BACKEND=s3 moves the
      # uploads, templates and dashboard records that go through engine.storage,
      # but generated reports are written to this directory directly and a
      # DuckDB database needs a real file, so both would stay here. Switching
      # wants a spec that covers all of it, not a bucket name.
      MCP_EXCEL_STORAGE_DIR: ${MCP_EXCEL_STORAGE_DIR:-/app/excel_storage}
      # How long a source's tables and columns are reused before the server is
      # read again. Shared by every worker.
      SOURCE_CATALOGUE_SECONDS: ${SOURCE_CATALOGUE_SECONDS:-3600}
      # Off: lists are filed by data group but nothing is hidden. Turning it on
      # before people are in groups leaves everyone but an administrator seeing
      # only what is in no group.
      DATA_GROUPS_ENFORCED: ${DATA_GROUPS_ENFORCED:-false}
      # The app's own store holds the audit trail either way. Off here, and on
      # by default in code, because this deployment shares the Snowflake audit
      # table with production: left on, every prompt tried here lands in the
      # trail production reads.
      AUDIT_TO_SNOWFLAKE: ${AUDIT_TO_SNOWFLAKE:-false}
      # Confirmation, invitation and password-reset emails. With no SMTP_HOST
      # nothing is sent, so nobody can confirm an email or reset a password.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      # Sign-in abuse limits and who the client IP is. TRUSTED_PROXIES must be
      # the Docker network the proxies (Traefik, nginx) sit on, as a CIDR: see
      # `docker network inspect web`. Empty, every request looks like it came from
      # the proxy and the per-IP limits become one bucket for everyone.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
    volumes:
      - app_data:/app/data
      - backend_excel_storage:/app/excel_storage
      - backend_config:/app/config
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.one-dev-api.rule=Host(`one-dev.${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.one-dev-api.entrypoints=websecure"
      - "traefik.http.routers.one-dev-api.tls.certresolver=le"
      - "traefik.http.routers.one-dev-api.middlewares=secure-headers@docker,ratelimit@docker"
      - "traefik.http.routers.one-dev-api.service=one-dev-api"
      - "traefik.http.services.one-dev-api.loadbalancer.server.port=8000"

  frontend:
    image: 629143592903.dkr.ecr.us-east-1.amazonaws.com/ai-reporting-fe:dev
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.one-dev.rule=Host(`one-dev.${DOMAIN}`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.one-dev.entrypoints=websecure"
      - "traefik.http.routers.one-dev.tls.certresolver=le"
      - "traefik.http.routers.one-dev.middlewares=secure-headers@docker,ratelimit@docker"
      - "traefik.http.routers.one-dev.service=one-dev"
      - "traefik.http.services.one-dev.loadbalancer.server.port=80"
