# Demo deployment (docs/specs/0009-free-demo-deployment.md).
# Replace RENDER_HOST with the Render service hostname before deploying.

[build]
  base = "frontend"
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The browser only ever talks to the Netlify origin, so the session cookie is
# first-party and CORS never comes into it.
[[redirects]]
  from = "/api/*"
  to = "https://RENDER_HOST/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
