server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api requests to backend.
    #
    # NO trailing slash on proxy_pass. With one, nginx replaces the matched
    # `/api/` prefix with `/`, so `/api/v1/auth/capabilities` reached the
    # backend as `/v1/auth/capabilities` and 404'd — every API call failed
    # while the page itself loaded fine. `/api/health` masked it by landing on
    # the real `/health` route and returning 200.
    #
    # Only local `docker compose` runs are affected: in production Traefik
    # routes PathPrefix(`/api`) straight to the backend and never comes
    # through here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Built scripts and styles. Vite puts a hash of the content in every name
    # here, so a new build brings new names: these can be kept for a year and
    # never go stale.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — index.html and everything else.
    #
    # no-cache means "check with the server before using a stored copy", not
    # "never store". It is what stops a browser holding on to an index.html
    # that names the PREVIOUS build's scripts: without any header a browser
    # guesses how long to keep it, and after a deploy the app came up old or
    # half-updated until a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
