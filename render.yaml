# Demo deployment (docs/specs/0009-free-demo-deployment.md).
services:
  - type: web
    name: dataalphaone-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SESSION_BACKEND
        value: memory
      # Anyone can sign up and gets a 14-day trial (spec 0010). No SMTP here,
      # so no email confirmation; the first account becomes the administrator.
      - key: SIGNUP_MODE
        value: open
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: TRIAL_DAYS
        value: "14"
      - key: TRIAL_MESSAGE_CAP
        value: "50"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: JWT_SECRET
        generateValue: true
      # Set these in the Render dashboard (never in this file):
      - key: FRONTEND_URL        # https://<site>.netlify.app
        sync: false
      - key: CORS_ORIGINS        # ["https://<site>.netlify.app"]
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        sync: false
      - key: SNOWFLAKE_DATABASE
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
